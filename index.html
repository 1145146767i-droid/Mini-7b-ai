<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini-7B AI · 本地 7B</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header>
  <div>
    <h1>🤖 Mini-7B AI</h1>
    <p id="modelLabel">本地模型加载中…</p>
  </div>
  <div class="actions">
    <span id="modelInfo" class="badge">⏳ 启动中</span>
    <button id="clear" class="secondary">清空</button>
  </div>
</header>

<section id="chat" class="chat" aria-live="polite"></section>

<form id="form" class="composer">
  <input id="input" autocomplete="off" disabled placeholder="等待本地 7B 模型加载…">
  <button type="submit">发送</button>
</form>

<footer id="status">正在连接本地模型服务器…</footer>
</main>
<script src="app.js"></script>
</body>
</html>
