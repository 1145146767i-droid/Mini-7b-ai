<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini-7B AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>🤖 Mini-7B AI</h1>
        <p>7B 小模型模拟器 · 本地运行 · 多轮对话</p>
      </div>
      <button id="clear" class="secondary">清空对话</button>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <div class="message bot">
        <div class="avatar">🤖</div>
        <div class="bubble">你好！我是 Mini-7B。你可以问我问题，我会尽量回答。<br><small>提示：这是一个轻量级“7B 模型行为模拟器”，并不是真的加载了 70 亿参数。</small></div>
      </div>
    </section>

    <form id="form" class="composer">
      <input id="input" autocomplete="off" placeholder="输入消息，例如：你好，介绍一下你自己" />
      <button type="submit">发送</button>
    </form>
    <footer>Mini-7B Simulator · 纯 HTML/CSS/JavaScript，无需服务器</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
